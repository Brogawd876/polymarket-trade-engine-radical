name: Test

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Typecheck backend
        run: bun run check

      - name: Reject secrets and forbidden production defaults
        run: |
          bun run security:secrets
          bun run security:defaults

      - name: Audit production dependencies for critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Run offline research-pipeline tests
        run: bun run test:python

      - name: Verify artifact hash and cross-language model parity
        run: bun run test:parity

      - name: Repeat deterministic exchange and continuous-bankroll replay tests
        run: bun run test:determinism

      - name: Run complete serial test suite
        run: bun test --max-concurrency=1

      - name: Run UI lint
        working-directory: ui
        run: bun run lint

      - name: Run UI tests
        working-directory: ui
        run: bun run test

      - name: Run UI production build
        working-directory: ui
        run: bun run build
